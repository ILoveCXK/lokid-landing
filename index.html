<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokid AR Glasses — The Smartest Player at Any Table</title>
  <meta name="description" content="AR glasses that coach you during chess and poker. Real-time move suggestions, blunder alerts, and automatic post-game reviews. Join the waitlist for 40% early-bird pricing.">
  <meta property="og:title" content="Lokid AR Glasses — The Smartest Player at Any Table">
  <meta property="og:description" content="AR glasses that coach you during chess and poker. Real-time move suggestions, blunder alerts, and post-game reviews.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #4ADE80;
      --green-dim: rgba(74, 222, 128, 0.12);
      --green-glow: rgba(74, 222, 128, 0.4);
      --black: #000000;
      --dark: #050505;
      --gray: #8a8a8a;
      --light-gray: #b0b0b0;
      --white: #f0f0f0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* === ANIMATED GRID === */
    .grid-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
      animation: gridDrift 40s linear infinite;
    }
    @keyframes gridDrift {
      0% { transform: perspective(500px) rotateX(2deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(2deg) translateY(-80px); }
    }

    /* === HORIZONTAL SCAN LINE === */
    .scanline {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--green) 50%, transparent 100%);
      opacity: 0.15;
      z-index: 999;
      pointer-events: none;
      animation: scanDown 8s linear infinite;
    }
    @keyframes scanDown {
      0% { top: -2px; }
      100% { top: 100vh; }
    }

    /* === FLOATING PARTICLES === */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--green);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-20vh) scale(1); }
    }

    /* === NAV === */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(74,222,128,0.08);
    }

    .nav-brand {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: var(--green);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .nav-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(74,222,128,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* === HERO === */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 140px 24px 100px;
      z-index: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px; height: 700px;
      background: radial-gradient(ellipse, rgba(74,222,128,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 900px;
      text-align: center;
    }

    .hud-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0.7;
    }
    .hud-status .blink {
      animation: blink 1.5s step-end infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .hero h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(44px, 7.5vw, 88px);
      line-height: 1.0;
      color: var(--white);
      margin-bottom: 32px;
      letter-spacing: -1px;
    }

    .hero h1 .green {
      color: var(--green);
      text-shadow: 0 0 40px rgba(74,222,128,0.3);
    }

    .hero-sub {
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
      color: var(--gray);
      max-width: 580px;
      margin: 0 auto 52px;
    }

    /* === HERO IMAGE === */
    .hero-image {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 940px;
      margin: 0 auto 60px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(74,222,128,0.15);
      box-shadow:
        0 0 100px rgba(74,222,128,0.06),
        0 30px 80px rgba(0,0,0,0.6);
    }
    .hero-image::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--green) 50%, transparent 100%);
      opacity: 0.5;
    }
    .hero-image img {
      width: 100%;
      display: block;
    }

    .hero-image-placeholder {
      width: 100%;
      max-width: 940px;
      margin: 0 auto 60px;
      aspect-ratio: 16/9;
      border-radius: 12px;
      border: 1px solid rgba(74,222,128,0.12);
      background: linear-gradient(160deg, #020a04 0%, #050505 50%, #020a04 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 100px rgba(74,222,128,0.06), 0 30px 80px rgba(0,0,0,0.6);
      z-index: 1;
    }
    .hero-image-placeholder::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60%; height: 50%;
      border: 1px solid rgba(74,222,128,0.08);
      border-radius: 120px;
    }
    .hero-image-placeholder .hud-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(74,222,128,0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .hero-image-placeholder .corner {
      position: absolute;
      width: 24px; height: 24px;
      border-color: rgba(74,222,128,0.2);
      border-style: solid;
    }
    .hero-image-placeholder .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
    .hero-image-placeholder .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
    .hero-image-placeholder .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
    .hero-image-placeholder .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    /* === FORM === */
    .form-section {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
    }

    .formkit-form { background: transparent !important; border: none !important; padding: 0 !important; min-width: 0 !important; }
    .formkit-form [data-style="clean"] { padding: 0 !important; }
    .formkit-fields { display: flex !important; gap: 0 !important; }
    .formkit-field { flex: 1 !important; }
    .formkit-input {
      padding: 18px 20px !important;
      font-size: 15px !important;
      font-family: 'Inter', sans-serif !important;
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid rgba(74,222,128,0.2) !important;
      border-right: none !important;
      border-radius: 6px 0 0 6px !important;
      color: #f0f0f0 !important;
      height: auto !important;
      width: 100% !important;
    }
    .formkit-input::placeholder { color: rgba(255,255,255,0.3) !important; }
    .formkit-input:focus { border-color: var(--green) !important; background: rgba(74,222,128,0.04) !important; outline: none !important; box-shadow: 0 0 20px rgba(74,222,128,0.1) !important; }
    .formkit-submit {
      padding: 18px 28px !important;
      font-size: 13px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-weight: 500 !important;
      text-transform: uppercase !important;
      letter-spacing: 2px !important;
      background: var(--green) !important;
      color: var(--black) !important;
      border: 1px solid var(--green) !important;
      border-radius: 0 6px 6px 0 !important;
      cursor: pointer !important;
      white-space: nowrap !important;
      transition: all 0.3s !important;
    }
    .formkit-submit:hover { background: #5eea94 !important; box-shadow: 0 0 40px rgba(74,222,128,0.3) !important; }
    .formkit-guarantee, .formkit-powered-by-convertkit-container { display: none !important; }
    .formkit-alert-success { display: block !important; color: var(--green) !important; font-family: 'Poppins', sans-serif !important; font-size: 18px !important; text-align: center !important; padding: 20px !important; }

    .form-note {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.25);
      margin-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }
    .form-note strong { color: var(--green); font-weight: 500; }

    .divider {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(74,222,128,0.15) 50%, transparent 100%);
    }

    /* === FEATURES === */
    .features {
      position: relative;
      z-index: 1;
      padding: 120px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .features-header {
      text-align: center;
      margin-bottom: 72px;
    }

    .features-header .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--green);
      opacity: 0.6;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 4vw, 42px);
      color: var(--white);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .feature-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(74,222,128,0.08);
      border-radius: 12px;
      padding: 40px 28px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .feature-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(74,222,128,0.3), transparent);
      opacity: 0;
      transition: opacity 0.5s;
    }
    .feature-card:hover {
      border-color: rgba(74,222,128,0.2);
      background: rgba(74,222,128,0.02);
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(74,222,128,0.05);
    }
    .feature-card:hover::before { opacity: 1; }

    .feature-icon {
      width: 48px; height: 48px;
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 20px;
      background: rgba(74,222,128,0.05);
    }

    .feature-card h3 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--white);
      margin-bottom: 12px;
    }

    .feature-card p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--gray);
    }

    /* === HOW IT WORKS === */
    .how-it-works {
      position: relative;
      z-index: 1;
      padding: 100px 24px 120px;
      max-width: 700px;
      margin: 0 auto;
    }

    .how-it-works .features-header {
      text-align: center;
      margin-bottom: 64px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .step {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      position: relative;
    }

    .step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 8px;
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(74,222,128,0.05);
    }

    .step-body h3 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--white);
      margin-bottom: 8px;
    }

    .step-body p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--gray);
    }

    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 19px;
      top: 48px;
      width: 1px;
      height: calc(100% + 8px);
      background: linear-gradient(180deg, rgba(74,222,128,0.2), transparent);
    }

    /* === BOTTOM CTA === */
    .cta-section {
      position: relative;
      z-index: 1;
      padding: 100px 24px 140px;
      text-align: center;
    }

    .cta-section h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 5vw, 48px);
      margin-bottom: 16px;
      color: var(--white);
    }

    .cta-sub {
      font-size: 17px;
      color: var(--gray);
      margin-bottom: 44px;
    }
    .cta-sub .green { color: var(--green); font-weight: 600; }

    /* === FOOTER === */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding: 36px 24px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }

    /* === MOBILE === */
    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .nav-tag { display: none; }
      .features-grid { grid-template-columns: 1fr; gap: 16px; }
      .hero { padding: 120px 20px 60px; }
      .formkit-fields { flex-direction: column !important; }
      .formkit-input { border-right: 1px solid rgba(74,222,128,0.2) !important; border-radius: 6px !important; border-bottom: none !important; }
      .formkit-submit { border-radius: 6px !important; width: 100% !important; }
      .step { gap: 16px; }
      .step:not(:last-child)::after { display: none; }
      .feature-card { padding: 28px 24px; }
    }

    /* === ANIMATIONS === */
    .fade-in {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-in:nth-child(2) { transition-delay: 0.1s; }
    .fade-in:nth-child(3) { transition-delay: 0.2s; }
  </style>
</head>
<body>

  <!-- Background effects -->
  <div class="grid-bg"></div>
  <div class="scanline"></div>
  <div class="particles" id="particles"></div>

  <!-- NAV -->
  <nav>
    <a href="#" class="nav-brand">Lokid</a>
    <span class="nav-tag">// AR Coaching Glasses</span>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <div class="hud-status">
        <span class="blink">&#9679;</span>&ensp;System Online — Pre-Launch Active
      </div>
      <h1>The smartest player<br>at <span class="green">any table</span></h1>
      <p class="hero-sub">AR glasses that coach you during chess and poker — real-time move suggestions, blunder alerts, and automatic post-game reviews.</p>
    </div>

    <!-- Hero image -->
    <div class="hero-image" id="heroImg">
      <img src="hero.jpg" alt="Lokid AR Glasses POV showing poker HUD overlay" onerror="document.getElementById('heroImg').style.display='none'; document.getElementById('heroPlaceholder').style.display='flex';">
    </div>
    <div class="hero-image-placeholder" id="heroPlaceholder" style="display:none;">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <span class="hud-label">[ Awaiting Visual Feed ]</span>
    </div>

    <!-- Kit Form -->
    <div class="form-section">
      <script async data-uid="faa6e4ec7b" src="https://lokid-2.kit.com/faa6e4ec7b/index.js"><\/script>
      <p class="form-note">Join waitlist for <strong>40% early-bird pricing</strong> at Kickstarter launch</p>
    </div>
  </section>

  <div class="divider"></div>

  <!-- FEATURES -->
  <section class="features">
    <div class="features-header">
      <p class="section-label fade-in">// Capabilities</p>
      <h2 class="section-title fade-in">Built for the game</h2>
    </div>
    <div class="features-grid">
      <div class="feature-card fade-in">
        <div class="feature-icon">&#9823;</div>
        <h3>Chess Coaching</h3>
        <p>Best move highlighted in real-time. Blunder warnings before you commit. Automatic post-game review with every session.</p>
      </div>
      <div class="feature-card fade-in">
        <div class="feature-icon">&#9830;</div>
        <h3>Poker Analytics</h3>
        <p>Live win probability, pot odds, and opponent tendency tags displayed right on the lens. Better decisions every hand.</p>
      </div>
      <div class="feature-card fade-in">
        <div class="feature-icon">&#9881;</div>
        <h3>Invisible Design</h3>
        <p>Looks like regular glasses. Lightweight, all-day comfortable, with a discreet micro-display only you can see.</p>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- HOW IT WORKS -->
  <section class="how-it-works">
    <div class="features-header">
      <p class="section-label fade-in">// Sequence</p>
      <h2 class="section-title fade-in">How it works</h2>
    </div>
    <div class="steps">
      <div class="step fade-in">
        <div class="step-num">01</div>
        <div class="step-body">
          <h3>Put on Lokid</h3>
          <p>Lightweight AR glasses that look like everyday eyewear. No one knows you're getting coached.</p>
        </div>
      </div>
      <div class="step fade-in">
        <div class="step-num">02</div>
        <div class="step-body">
          <h3>Play your game</h3>
          <p>Onboard AI recognizes the board state, cards, and opponents in real time through the built-in camera.</p>
        </div>
      </div>
      <div class="step fade-in">
        <div class="step-num">03</div>
        <div class="step-body">
          <h3>See the edge</h3>
          <p>Win probabilities, optimal moves, and opponent patterns appear on your lens as a subtle green HUD.</p>
        </div>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- BOTTOM CTA -->
  <section class="cta-section">
    <h2 class="fade-in">Ready to level up?</h2>
    <p class="cta-sub fade-in">Early supporters get <span class="green">40% off</span> at launch.</p>
    <div class="form-section fade-in">
      <script async data-uid="faa6e4ec7b" src="https://lokid-2.kit.com/faa6e4ec7b/index.js"><\/script>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 Lokid &ensp;|&ensp; AR Coaching Systems
  </footer>

  <script>
    // Scroll animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Floating particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
      container.appendChild(p);
    }
  <\/script>

</body>
    </html>
